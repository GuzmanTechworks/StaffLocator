<ion-app>

  @if (showSplash()) {
  <div class="app-splash">
    <div class="app-splash-content">

      <img
        class="splash-logo"
        src="assets/logo/cagayan.png"
        alt="Cagayan Provincial Government Logo"
      >

      <div class="splash-text-block">
        <p class="splash-title splash-black">
          Provincial Government of Cagayan
        </p>

        <p class="splash-title splash-black">
          Information Systems Division
        </p>

        @if (!connectionMessage().includes('Failed')) {
        <div class="splash-loading" role="progressbar" aria-label="Loading"></div>
        }

        <p class="splash-status" [class.splash-error]="connectionMessage().includes('Failed')">
          {{ connectionMessage() }}
        </p>
      </div>

    </div>
  </div>
  }

  <ion-router-outlet></ion-router-outlet>

</ion-app>

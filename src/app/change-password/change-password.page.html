<ion-content [fullscreen]="true"><main class="workspace" [class.sidebar-collapsed]="sidebarCollapsed"><aside *ngIf="session" class="sidebar" [class.sidebar-open]="sidebarOpen" [class.sidebar-collapsed]="sidebarCollapsed"><div class="sidebar-heading"><div class="sidebar-brand"><img src="assets/logo/cagayan.png" alt="PGC Logo"><div class="sidebar-brand-copy"><p class="eyebrow">PGC Information Systems Division</p><strong>Staff Locator</strong></div></div><button class="sidebar-close" type="button" (click)="closeSidebar()" aria-label="Close navigation"><ion-icon name="close-outline"></ion-icon></button></div><nav><a routerLink="/dashboard" routerLinkActive="active" (click)="closeSidebar()"><ion-icon name="grid-outline"></ion-icon>Dashboard</a><a routerLink="/history" routerLinkActive="active" (click)="closeSidebar()"><ion-icon name="time-outline"></ion-icon>Movement history</a><a routerLink="/change-password" routerLinkActive="active" (click)="closeSidebar()"><ion-icon name="lock-closed-outline"></ion-icon>Change password</a><a routerLink="/system-management" routerLinkActive="active" (click)="closeSidebar()"><ion-icon name="settings-outline"></ion-icon>System management</a></nav><a class="sidebar-download web-download" href="https://stafflocator.cloud.cagayan.gov.ph/assets/ISDStaffLocator.apk"><ion-icon name="download-outline"></ion-icon>DOWNLOAD APK</a><button class="sidebar-logout" *ngIf="session" type="button" (click)="logout()"><ion-icon name="log-out-outline"></ion-icon>Log out</button></aside><button class="sidebar-scrim" *ngIf="sidebarOpen" type="button" (click)="closeSidebar()" aria-label="Close navigation"></button><header class="workspace-header"><button *ngIf="session" class="menu-toggle" type="button" (click)="toggleSidebar()" aria-label="Open navigation"><ion-icon name="menu-outline"></ion-icon></button><div class="page-title">CHANGE PASSWORD</div><div *ngIf="session; else signInAction" class="user-status"><strong>{{ currentUsername }}</strong><span>{{ currentRole }}</span></div><ng-template #signInAction><a class="sign-in-button" routerLink="/sign-in">SIGN IN</a></ng-template></header><section class="profile-row"><div><p class="eyebrow">ACCOUNT SECURITY</p><h2>Change password</h2></div></section><p class="notice success" *ngIf="message">{{ message }}</p><p class="notice danger" *ngIf="error">{{ error }}</p><section class="panel"><form (ngSubmit)="changePassword()"><ion-input type="password" label="Current password" label-placement="stacked" fill="outline" [(ngModel)]="currentPassword" name="currentPassword" required></ion-input><ion-input type="password" label="New password" label-placement="stacked" fill="outline" [(ngModel)]="changePasswordValue" name="newPassword" minlength="6" required></ion-input><ion-button type="submit" [disabled]="!currentPassword || changePasswordValue.length < 6">Change password</ion-button></form></section></main></ion-content>

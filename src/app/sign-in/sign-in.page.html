<ion-content [fullscreen]="true">
  <main class="login-shell">
    <section class="login-card">
      <img class="login-logo" src="assets/logo/cagayan.png" alt="PGC Logo">
      <p class="eyebrow">PGC Information Systems Division</p>
      <h1>Sign in</h1>
      <p class="login-copy">Sign in to record when you leave or return to the office.</p>
      <p class="notice danger" *ngIf="error">{{ error }}</p>
      <form (ngSubmit)="submit()">
        <ion-input label="Username" label-placement="stacked" fill="outline" [(ngModel)]="username" name="username"
          required></ion-input>
        <ion-input label="Password" label-placement="stacked" fill="outline" type="password" [(ngModel)]="password"
          name="password" required></ion-input>
        <ion-button expand="block" type="submit" [disabled]="isSubmitting || !username || !password">{{ isSubmitting ?
          'Signing in...' : 'Sign in' }}</ion-button>
      </form>
      <ion-button *ngIf="canUseFingerprint" expand="block" fill="outline" type="button" [disabled]="biometricBusy"
        (click)="useFingerprintSignIn()">
        {{ biometricBusy ? 'Checking fingerprint...' : 'Use fingerprint' }}
      </ion-button>
    </section>
  </main>
</ion-content>
